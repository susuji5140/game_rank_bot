name: 게임 순위 자동 업데이트

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 0시) 실행
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동 실행 버튼도 만듦

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 라이브러리 설치 (requests)
        run: pip install requests

      - name: 파이썬 스크립트 실행
        run: python get_rank_api.py

      - name: 결과(json) 저장하고 깃허브에 올리기
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add game_data.json
          git commit -m "게임 순위 업데이트 완료" || exit 0
          git push
